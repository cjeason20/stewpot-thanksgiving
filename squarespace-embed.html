<!--
  Paste this into a Squarespace Code Block (Edit page → + Add block → Code; Display Source unchecked).
  Already set to https://stewthx.netlify.app. If the form moves to a new address, change it in both places (no slash at the end of ORIGIN).
  - The iframe alone works on any plan; it starts 2600px tall and scrolls inside if needed.
  - The <script> lets the frame grow/shrink with the form so there's no inner scrollbar.
-->
<iframe id="stewpot-thanksgiving"
  src="https://stewthx.netlify.app/?embed=1"
  title="A Seat at the Table: Thanksgiving volunteer sign-up"
  style="display:block;width:100%;height:2600px;border:0;"
  loading="lazy"></iframe>
<script>
(function () {
  var ORIGIN = "https://stewthx.netlify.app";
  var frame = document.getElementById("stewpot-thanksgiving");
  window.addEventListener("message", function (e) {
    if (e.origin !== ORIGIN || !e.data) return;
    var top = frame.getBoundingClientRect().top + window.pageYOffset;
    if (e.data.type === "stewpot-height") frame.style.height = e.data.height + "px";
    if (e.data.type === "stewpot-scroll") window.scrollTo({ top: top - 80, behavior: "smooth" });
    if (e.data.type === "stewpot-scroll-to") window.scrollTo({ top: top + e.data.offset, behavior: "smooth" });
  });
})();
</script>
